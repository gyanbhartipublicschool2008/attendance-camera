<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gyan Bharti - Secure Face Camera</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eef2f5;font-family:Arial,sans-serif;color:#222}
  .wrap{max-width:520px;margin:auto;padding:14px}
  .card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 3px 14px rgba(0,0,0,.12)}
  h2{margin:0 0 5px;color:#1a73e8;font-size:20px}
  .sub{font-size:12px;color:#666;margin-bottom:12px}
  .videoBox{position:relative;background:#000;border-radius:14px;overflow:hidden;width:100%;aspect-ratio:4/3}
  video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
  canvas{display:none}
  .guide{position:absolute;inset:10% 15%;border:2px solid rgba(255,255,255,.8);border-radius:45%;pointer-events:none}
  .status{padding:10px;margin:10px 0;border-radius:9px;background:#f1f3f4;font-size:13px;font-weight:600}
  button{width:100%;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
  #start{background:#1a73e8;color:#fff}
  #capture{background:#28a745;color:#fff}
  #close{background:#777;color:#fff}
  button:disabled{opacity:.55;cursor:not-allowed}
  .score{font-size:13px;color:#555;text-align:center;margin-top:8px}
  .ok{color:#188038}.bad{color:#d93025}
</style>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/human@3.3.6/dist/human.js"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>🔐 Secure Face Camera</h2>
    <div class="sub" id="title">Camera initialise ho raha hai...</div>

    <div class="videoBox">
      <video id="video" autoplay playsinline muted></video>
      <div class="guide"></div>
      <canvas id="canvas"></canvas>
    </div>

    <div class="status" id="status">AI model load ho raha hai...</div>
    <div class="score" id="score"></div>

    <button id="start" onclick="startCamera()">📷 Camera Start Karein</button>
    <button id="capture" onclick="capture()" disabled>📸 Capture Photo</button>
    <button id="close" onclick="finish(false)">Cancel</button>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const mode = params.get('mode') || 'registration';
const token = params.get('token') || '';
const teacher = params.get('teacher') || '';
const type = params.get('type') || '';
const scriptUrl = params.get('script') || '';

let stream = null;
let masterEmbedding = null;
let humanReady = false;
let busy = false;

const humanConfig = {
  backend: 'webgl',
  modelBasePath: 'https://vladmandic.github.io/human-models/models/',
  cacheModels: true,
  filter: { enabled: true, equalization: true, autoBrightness: true },
  face: {
    enabled: true,
    detector: {
      rotation: true,
      return: true,
      maxDetected: 2,
      minConfidence: 0.55
    },
    mesh: { enabled: true },
    description: { enabled: true },
    antispoof: { enabled: true },
    liveness: { enabled: true },
    iris: { enabled: false },
    emotion: { enabled: false },
    age: { enabled: false },
    gender: { enabled: false }
  },
  body: { enabled: false },
  hand: { enabled: false },
  object: { enabled: false },
  gesture: { enabled: false },
  segmentation: { enabled: false }
};

const human = new Human.Human(humanConfig);

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

function setScore(msg) {
  document.getElementById('score').textContent = msg || '';
}

async function init() {
  document.getElementById('title').textContent =
    mode === 'punch'
      ? (teacher + ' - Punch ' + type)
      : 'Master Face Registration';

  if (mode === 'punch' && (!scriptUrl || !token)) {
    setStatus('Camera session information missing.', 'bad');
    return;
  }

  try {
    setStatus('AI models load ho rahe hain...');
    await human.load();
    await human.warmup();
    humanReady = true;

    if (mode === 'punch') {
      await loadMasterEmbedding();
      if (!masterEmbedding) return;
    }

    setStatus('Camera start karne ke liye button dabayein.');
  } catch (e) {
    console.error(e);
    setStatus('AI model load nahi hua: ' + (e.message || e), 'bad');
  }
}

function loadMasterEmbedding() {
  return new Promise((resolve) => {
    const callbackName = 'cameraCallback_' + Date.now();
    window[callbackName] = function(res) {
      try { delete window[callbackName]; } catch(e) {}
      if (!res || !res.success || !Array.isArray(res.embedding)) {
        setStatus((res && res.message) || 'Master Face AI data nahi mila.', 'bad');
        resolve(false);
        return;
      }
      masterEmbedding = res.embedding;
      setScore('Master Face AI data ready.');
      resolve(true);
    };

    const s = document.createElement('script');
    s.src = scriptUrl +
      '?action=cameraSession&token=' + encodeURIComponent(token) +
      '&callback=' + callbackName +
      '&_=' + Date.now();
    s.onerror = function() {
      try { delete window[callbackName]; } catch(e) {}
      setStatus('Google Apps Script se Face AI data nahi mila.', 'bad');
      resolve(false);
    };
    document.body.appendChild(s);
  });
}

async function startCamera() {
  if (!humanReady) {
    setStatus('AI model abhi ready nahi hai.', 'bad');
    return;
  }

  stopCamera();

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'user' },
        width: { ideal: 640 },
        height: { ideal: 480 }
      },
      audio: false
    });

    const video = document.getElementById('video');
    video.srcObject = stream;
    await video.play();

    document.getElementById('capture').disabled = false;
    setStatus('Face ko oval ke andar rakhein, phir Capture Photo dabayein.');
    setScore('');
  } catch (e) {
    console.error(e);
    setStatus('Chrome camera permission Allow karein. Error: ' + (e.message || e), 'bad');
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
}

async function capture() {
  if (busy || !stream) return;
  busy = true;
  document.getElementById('capture').disabled = true;

  try {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    const w = video.videoWidth || 640;
    const h = video.videoHeight || 480;
    const max = 720;
    const scale = Math.min(1, max / Math.max(w, h));

    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);

    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // Do not mirror the saved image; the AI sees the normal camera orientation.
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    setStatus('Face AI verification chal raha hai...');
    setScore('');

    const result = await human.detect(canvas);

    if (!result.face || result.face.length !== 1) {
      throw new Error(
        !result.face || result.face.length === 0
          ? 'Face detect nahi hua. Roshni badhayein aur camera ke saamne seedhe dekhein.'
          : 'Ek se zyada face detect hua. Sirf ek person camera ke saamne ho.'
      );
    }

    const face = result.face[0];

    if (!face.embedding || !Array.isArray(face.embedding) || !face.embedding.length) {
      throw new Error('Face AI embedding generate nahi hua. Dobara photo lein.');
    }

    // Human exposes anti-spoof and liveness scores as face.real and face.live.
    if (mode === 'punch') {
      const real = Number(face.real == null ? 1 : face.real);
      const live = Number(face.live == null ? 1 : face.live);

      setScore(
        'Match check...  |  Real: ' + (real * 100).toFixed(0) +
        '%  | Live: ' + (live * 100).toFixed(0) + '%'
      );

      if (real < 0.50 || live < 0.05) {
        throw new Error('Live face confirm nahi hua. Photo/video screen ke bajay apna face camera ke saamne rakhein.');
      }

      const similarity = human.match.similarity(masterEmbedding, face.embedding);
      const similarityPct = Number(similarity) * 100;
      const verified = similarity >= 0.50;

      setScore(
        'Similarity: ' + similarityPct.toFixed(1) + '%'
      );

      sendToOpener({
        source: 'GBPS_ATTENDANCE_CAMERA',
        action: 'punchResult',
        success: true,
        verified: verified,
        similarity: similarityPct,
        photoData: canvas.toDataURL('image/jpeg', 0.82)
      });

      setStatus(
  verified
    ? '✔️ Face Match ho gaya. Wapas original page par ja rahe hain...'
    : '❌ Face Match nahi hua. Dobara try karein.',
  verified ? 'ok' : 'bad'
);

if (verified) {
  setTimeout(() => finish(true), 500);
}

    } else {
      // Registration: store both the photo and the browser-generated embedding.
      sendToOpener({
        source: 'GBPS_ATTENDANCE_CAMERA',
        action: 'registrationResult',
        success: true,
        embedding: face.embedding,
        photoData: canvas.toDataURL('image/jpeg', 0.82)
      });

      setScore('Face AI data successfully generated.');
setStatus('✔️ Master Face capture ho gaya. Wapas original page par ja rahe hain...', 'ok');
setTimeout(() => finish(true), 500);
    }

    stopCamera();
  } catch (e) {
    console.error(e);
    setStatus('❌ ' + (e.message || e), 'bad');
    document.getElementById('capture').disabled = false;
  } finally {
    busy = false;
  }
}

function sendToOpener(data) {
  if (window.opener && !window.opener.closed) {
    window.opener.postMessage(data, '*');
  } else {
    setStatus('Original attendance window nahi mili. Is page ko app ke Camera button se kholein.', 'bad');
  }
}

function finish(success) {
  stopCamera();

  // Jis page se camera window khuli thi, usi page ko wapas active karein
  if (window.opener && !window.opener.closed) {
    try {
      window.opener.focus();

      window.opener.postMessage({
        source: 'GBPS_ATTENDANCE_CAMERA',
        action: 'cameraFinished',
        success: success === true
      }, '*');
    } catch (e) {
      console.error('Opener message error:', e);
    }

    // Camera wali popup/window close karein
    setTimeout(() => {
      try {
        window.close();
      } catch (e) {
        console.error('Window close error:', e);
      }
    }, 200);
  } else {
    // Agar opener nahi hai to camera page par hi message dikhayein
    setStatus(
      'Original page nahi mila. Camera ko original attendance page se open karein.',
      'bad'
    );
  }
}
window.addEventListener('beforeunload', stopCamera);
init();
</script>
</body>
</html>
