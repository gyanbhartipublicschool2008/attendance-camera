<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GBPS Attendance Camera</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;

  color:#222;
}

}

<body>
<div class="wrap">
  <div class="card">

    <h2 id="title">Attendance Camera</h2>

    <div id="status">Camera start karne ke liye button dabayein.</div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <button id="startBtn" onclick="startCamera()">📷 Start Camera</button>
    <button id="captureBtn" onclick="capture()" disabled>📸 Capture</button>
    <button id="closeBtn" onclick="finish(false)">✖ Close</button>

  </div>
</div>

<script>
/* =========================================================
   GBPS ATTENDANCE CAMERA
   WebIntoApp / Chrome compatible version
   ========================================================= */

const params = new URLSearchParams(location.search);

const mode       = params.get('mode') || 'registration';
const token      = params.get('token') || '';
const teacher    = params.get('teacher') || '';
const type       = params.get('type') || '';
const scriptUrl  = params.get('script') || '';
const returnUrl  = params.get('returnUrl') || '';

let stream = null;
let human = null;
let masterEmbedding = null;
let cameraStarted = false;
let processing = false;


/* ---------------------------------------------------------
   PAGE TITLE
--------------------------------------------------------- */

if (mode === 'punch') {
  document.getElementById('title').innerText =
    teacher + ' - Punch ' + type;
} else {
  document.getElementById('title').innerText =
    'Master Face Registration';
}


/* ---------------------------------------------------------
   STATUS
--------------------------------------------------------- */

function setStatus(message, cls) {
  const el = document.getElementById('status');

  el.innerText = message;

  if (cls === 'bad') {
    el.style.color = '#d32f2f';
  } else if (cls === 'good') {
    el.style.color = '#2e7d32';
  } else {
    el.style.color = '#333';
  }
}


/* ---------------------------------------------------------
   INITIALIZE
--------------------------------------------------------- */

async function init() {

  try {

    setStatus('Camera system load ho raha hai...');

    /*
      Human AI library
    */
    if (!window.Human) {
      await loadHuman();
    }

    human = new Human({
      backend: 'webgl',
      modelBasePath:
        'https://cdn.jsdelivr.net/npm/@vladmandic/human/models/',
      face: {
        enabled: true,
        detector: {
          rotation: true,
          return: true
        },
        mesh: {
          enabled: true
        },
        attention: {
          enabled: false
        },
        iris: {
          enabled: false
        },
        description: {
          enabled: true
        },
        emotion: {
          enabled: false
        }
      },
      body: {
        enabled: false
      },
      hand: {
        enabled: false
      },
      gesture: {
        enabled: false
      }
    });

    await human.load();
    await human.warmup();

    if (mode === 'punch') {
      await loadMasterEmbedding();
    } else {
      setStatus(
        'Master Face registration ke liye camera start karein.'
      );
    }

  } catch (e) {

    console.error(e);

    setStatus(
      'Camera system load nahi ho saka: ' + e.message,
      'bad'
    );
  }
}


/* ---------------------------------------------------------
   LOAD HUMAN LIBRARY
--------------------------------------------------------- */

function loadHuman() {

  return new Promise((resolve, reject) => {

    const s = document.createElement('script');

    s.src =
      'https://cdn.jsdelivr.net/npm/@vladmandic/human/dist/human.js';

    s.onload = resolve;
    s.onerror = reject;

    document.head.appendChild(s);
  });
}


/* ---------------------------------------------------------
   LOAD MASTER FACE EMBEDDING
--------------------------------------------------------- */

function loadMasterEmbedding() {

  return new Promise((resolve) => {

    if (!scriptUrl || !token) {

      setStatus(
        'Camera session information missing.',
        'bad'
      );

      resolve();
      return;
    }

    const callbackName =
      'cameraMaster_' +
      Date.now() +
      '_' +
      Math.floor(Math.random() * 100000);

    window[callbackName] = function(data) {

      try {

        if (!data || !data.success) {

          setStatus(
            'Master Face data nahi mili.',
            'bad'
          );

          resolve();
          return;
        }

        masterEmbedding =
          data.embedding || null;

        if (!masterEmbedding) {

          setStatus(
            'Master Face embedding missing hai.',
            'bad'
          );

          resolve();
          return;
        }

        setStatus(
          'Master Face loaded. Ab camera start karein.',
          'good'
        );

      } catch (e) {

        console.error(e);

        setStatus(
          'Master Face load error.',
          'bad'
        );

      }

      resolve();
    };

    const s = document.createElement('script');

    s.src =
      scriptUrl +
      '?action=cameraSession' +
      '&token=' +
      encodeURIComponent(token) +
      '&callback=' +
      encodeURIComponent(callbackName) +
      '&_=' +
      Date.now();

    s.onerror = function() {

      setStatus(
        'Attendance server se connection nahi hua.',
        'bad'
      );

      resolve();
    };

    document.body.appendChild(s);

  });
}


/* ---------------------------------------------------------
   START CAMERA
--------------------------------------------------------- */

async function startCamera() {

  if (cameraStarted) return;

  try {

    setStatus(
      'Chrome/WebIntoApp camera permission maang raha hai...'
    );

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        'Is browser/app me camera access supported nahi hai.'
      );
    }

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: 'user'
          },
          width: {
            ideal: 640
          },
          height: {
            ideal: 480
          }
        },

        audio: false
      });

    const video =
      document.getElementById('video');

    video.srcObject = stream;

    await video.play();

    cameraStarted = true;

    document.getElementById('startBtn').disabled = true;
    document.getElementById('captureBtn').disabled = false;

    setStatus(
      'Camera ready hai. Face ko frame ke beech me rakhein.',
      'good'
    );

  } catch (e) {

    console.error(e);

    setStatus(
      'Camera start nahi hua: ' +
      (e.message || e),
      'bad'
    );
  }
}


/* ---------------------------------------------------------
   CAPTURE
--------------------------------------------------------- */

async function capture() {

  if (processing) return;

  if (!cameraStarted || !stream) {

    setStatus(
      'Pehle camera start karein.',
      'bad'
    );

    return;
  }

  if (!human) {

    setStatus(
      'Face system abhi ready nahi hai.',
      'bad'
    );

    return;
  }

  processing = true;

  const captureBtn =
    document.getElementById('captureBtn');

  captureBtn.disabled = true;

  setStatus(
    'Face scan ho raha hai...'
  );

  try {

    const video =
      document.getElementById('video');

    const canvas =
      document.getElementById('canvas');

    canvas.width =
      video.videoWidth || 640;

    canvas.height =
      video.videoHeight || 480;

    const ctx =
      canvas.getContext('2d');

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const result =
      await human.detect(canvas);

    const faces =
      result.face || [];

    if (faces.length !== 1) {

      setStatus(
        faces.length === 0
          ? 'Face nahi mila. Camera ke saamne face clearly rakhein.'
          : 'Ek samay par sirf ek face hona chahiye.',
        'bad'
      );

      processing = false;
      captureBtn.disabled = false;

      return;
    }

    const face = faces[0];

    if (!face.embedding) {

      setStatus(
        'Face embedding generate nahi hui. Dobara try karein.',
        'bad'
      );

      processing = false;
      captureBtn.disabled = false;

      return;
    }


    /* -----------------------------------------------------
       REGISTRATION MODE
    ----------------------------------------------------- */

    if (mode === 'registration') {

      const photoData =
        canvas.toDataURL(
          'image/jpeg',
          0.82
        );

      sendToOpener({

        source:
          'GBPS_ATTENDANCE_CAMERA',

        action:
          'registrationResult',

        success:
          true,

        embedding:
          face.embedding,

        photoData:
          photoData
      });

      setStatus(
        'Master Face capture ho gaya.',
        'good'
      );

      finish(true);

      return;
    }


    /* -----------------------------------------------------
       PUNCH MODE
    ----------------------------------------------------- */

    if (!masterEmbedding) {

      setStatus(
        'Master Face data available nahi hai.',
        'bad'
      );

      processing = false;
      captureBtn.disabled = false;

      return;
    }


    /* -----------------------------------------------------
       FACE SIMILARITY
    ----------------------------------------------------- */

    let similarity = 0;

    try {

      similarity =
        human.match.similarity(
          face.embedding,
          masterEmbedding
        );

    } catch (e) {

      console.error(e);

      setStatus(
        'Face matching error.',
        'bad'
      );

      processing = false;
      captureBtn.disabled = false;

      return;
    }


    /*
      Human similarity normally 0-1 range
    */

    const similarityPct =
      Math.max(
        0,
        Math.min(
          100,
          similarity * 100
        )
      );


    /*
      Existing threshold:
      FACE_MATCH_THRESHOLD = 0.50
    */

    const verified =
      similarity >= 0.50;


    const photoData =
      canvas.toDataURL(
        'image/jpeg',
        0.82
      );


    if (!verified) {

      setStatus(
        'Face Match nahi hua. Similarity: ' +
        similarityPct.toFixed(1) +
        '%. Dobara try karein.',
        'bad'
      );

      sendToOpener({

        source:
          'GBPS_ATTENDANCE_CAMERA',

        action:
          'punchResult',

        success:
          true,

        verified:
          false,

        similarity:
          similarityPct,

        photoData:
          photoData,

        token:
          token
      });

      processing = false;
      captureBtn.disabled = false;

      return;
    }


    /* -----------------------------------------------------
       VERIFIED PUNCH
    ----------------------------------------------------- */

    setStatus(
      '✔️ Face Match: ' +
      similarityPct.toFixed(1) +
      '%. Photo verified.',
      'good'
    );


    sendToOpener({

      source:
        'GBPS_ATTENDANCE_CAMERA',

      action:
        'punchResult',

      success:
        true,

      verified:
        true,

      similarity:
        similarityPct,

      photoData:
        photoData,

      token:
        token
    });


    /*
      IMPORTANT:
      WebIntoApp me window.opener available nahi hota.
      Isliye result Apps Script ko POST bhi kiya jaata hai.
    */

    submitPunchResultToServer({

      source:
        'GBPS_ATTENDANCE_CAMERA',

      action:
        'punchResult',

      success:
        true,

      verified:
        true,

      similarity:
        similarityPct,

      photoData:
        photoData,

      token:
        token
    });


    finish(true);

  } catch (e) {

    console.error(e);

    setStatus(
      'Face processing error: ' +
      (e.message || e),
      'bad'
    );

    processing = false;

    captureBtn.disabled = false;
  }
}


/* ---------------------------------------------------------
   SEND RESULT TO ORIGINAL WINDOW
   Chrome me kaam karega
--------------------------------------------------------- */

function sendToOpener(data) {

  try {

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(
        data,
        '*'
      );

      return true;
    }

  } catch (e) {

    console.error(
      'Opener message error:',
      e
    );
  }

  return false;
}


/* ---------------------------------------------------------
   WEBVIEW FALLBACK
   Apps Script ko hidden POST
--------------------------------------------------------- */

function submitPunchResultToServer(data) {

  if (!scriptUrl || !token) {

    console.error(
      'scriptUrl/token missing'
    );

    return;
  }

  try {

    const iframe =
      document.createElement('iframe');

    iframe.style.display = 'none';
    iframe.name =
      'cameraPostFrame_' +
      Date.now();

    document.body.appendChild(iframe);


    const form =
      document.createElement('form');

    form.method =
      'POST';

    form.action =
      scriptUrl;

    form.target =
      iframe.name;

    form.style.display =
      'none';


    function addField(name, value) {

      const input =
        document.createElement('input');

      input.type =
        'hidden';

      input.name =
        name;

      input.value =
        value == null
          ? ''
          : String(value);

      form.appendChild(input);
    }


    addField(
      'action',
      'cameraResult'
    );

    addField(
      'token',
      token
    );

    addField(
      'verified',
      data.verified === true
        ? 'true'
        : 'false'
    );

    addField(
      'similarity',
      data.similarity || 0
    );

    addField(
      'photoData',
      data.photoData || ''
    );


    document.body.appendChild(form);

    form.submit();


    /*
      Cleanup
    */

    setTimeout(() => {

      try {
        form.remove();
      } catch (e) {}

      try {
        iframe.remove();
      } catch (e) {}

    }, 10000);

  } catch (e) {

    console.error(
      'Camera result POST error:',
      e
    );
  }
}


/* ---------------------------------------------------------
   FINISH CAMERA
--------------------------------------------------------- */

function finish(success) {

  stopCamera();


  /*
    Chrome:
    Original page ke opener ko message bhejo
  */

  if (
    window.opener &&
    !window.opener.closed
  ) {

    try {

      window.opener.focus();

      window.opener.postMessage({

        source:
          'GBPS_ATTENDANCE_CAMERA',

        action:
          'cameraFinished',

        success:
          success === true,

        token:
          token

      }, '*');

    } catch (e) {

      console.error(
        'Finish opener error:',
        e
      );
    }


    setTimeout(() => {

      try {
        window.close();
      } catch (e) {}

    }, 200);

    return;
  }


  /*
    WebIntoApp:
    Original page same WebView me replace ho sakta hai.
    Isliye attendance portal par token ke saath return.
  */

  if (
    mode === 'punch' &&
    success === true &&
    returnUrl &&
    token
  ) {

    setTimeout(() => {

      try {

        const separator =
          returnUrl.indexOf('?') >= 0
            ? '&'
            : '?';

        window.location.replace(
          returnUrl +
          separator +
          'cameraResult=' +
          encodeURIComponent(token)
        );

      } catch (e) {

        console.error(
          'Return URL error:',
          e
        );

        setStatus(
          'Original attendance page open nahi ho saka.',
          'bad'
        );
      }

    }, 400);

    return;
  }


  if (
    mode === 'registration'
  ) {

    setStatus(
      'Master Face capture complete.',
      'good'
    );

    return;
  }


  setStatus(
    'Original attendance page nahi mila. Camera ko attendance page se open karein.',
    'bad'
  );
}


/* ---------------------------------------------------------
   STOP CAMERA
--------------------------------------------------------- */

function stopCamera() {

  if (stream) {

    try {

      stream
        .getTracks()
        .forEach(track => {
          try {
            track.stop();
          } catch (e) {}
        });

    } catch (e) {}

    stream = null;
  }

  cameraStarted = false;

  const video =
    document.getElementById('video');

  if (video) {
    video.srcObject = null;
  }
}


/* ---------------------------------------------------------
   PAGE CLOSE / BACK
--------------------------------------------------------- */

window.addEventListener(
  'beforeunload',
  function() {
    stopCamera();
  }
);


/* ---------------------------------------------------------
   START
--------------------------------------------------------- */

init();

</script>
</body>
</html>
