<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gyan Bharti - Secure Face Camera</title>

<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eef2f5;font-family:Arial,sans-serif;color:#222}
  .wrap{max-width:520px;margin:auto;padding:14px}
  .card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 3px 14px rgba(0,0,0,.12)}
  h2{margin:0 0 5px;color:#1a73e8;font-size:20px}
  .sub{font-size:12px;color:#666;margin-bottom:12px}
  .videoBox{position:relative;background:#000;border-radius:14px;overflow:hidden;width:100%;aspect-ratio:4/3}
  video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
  canvas{display:none}
  .guide{position:absolute;inset:10% 15%;border:2px solid rgba(255,255,255,.8);border-radius:45%;pointer-events:none}
  .status{padding:10px;margin:10px 0;border-radius:9px;background:#f1f3f4;font-size:13px;font-weight:600}
  button{width:100%;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
  #start{background:#1a73e8;color:#fff}
  #capture{background:#28a745;color:#fff}
  #close{background:#777;color:#fff}
  button:disabled{opacity:.55;cursor:not-allowed}
  .score{font-size:13px;color:#555;text-align:center;margin-top:8px}
  .ok{color:#188038}
  .bad{color:#d93025}
</style>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/human@3.3.6/dist/human.js"></script>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h2>🔐 Secure Face Camera</h2>

    <div class="sub" id="title">
      Camera initialise ho raha hai...
    </div>

    <div class="videoBox">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <div class="guide"></div>

      <canvas id="canvas"></canvas>

    </div>

    <div class="status" id="status">
      AI model load ho raha hai...
    </div>

    <div class="score" id="score"></div>

    <button id="start" onclick="startCamera()">
      📷 Camera Start Karein
    </button>

    <button id="capture" onclick="capture()" disabled>
      📸 Capture Photo
    </button>

    <button id="close" onclick="finish(false)">
      Cancel
    </button>

  </div>
</div>


<script>

const params = new URLSearchParams(location.search);

const mode = params.get('mode') || 'registration';
const token = params.get('token') || '';
const teacher = params.get('teacher') || '';
const type = params.get('type') || '';
const scriptUrl = params.get('script') || '';

/*
 * WebIntoApp fallback:
 * Punch camera ke baad original Apps Script page par
 * cameraResult token ke saath wapas jayega.
 */
const returnUrl = params.get('returnUrl') || '';


let stream = null;
let masterEmbedding = null;
let humanReady = false;
let busy = false;


/* =========================
   HUMAN AI CONFIG
========================= */

const humanConfig = {

  backend: 'webgl',

  modelBasePath:
    'https://vladmandic.github.io/human-models/models/',

  cacheModels: true,

  filter: {
    enabled: true,
    equalization: true,
    autoBrightness: true
  },

  face: {

    enabled: true,

    detector: {
      rotation: true,
      return: true,
      maxDetected: 2,
      minConfidence: 0.55
    },

    mesh: {
      enabled: true
    },

    description: {
      enabled: true
    },

    antispoof: {
      enabled: true
    },

    liveness: {
      enabled: true
    },

    iris: {
      enabled: false
    },

    emotion: {
      enabled: false
    },

    age: {
      enabled: false
    },

    gender: {
      enabled: false
    }

  },

  body: {
    enabled: false
  },

  hand: {
    enabled: false
  },

  object: {
    enabled: false
  },

  gesture: {
    enabled: false
  },

  segmentation: {
    enabled: false
  }

};


const human = new Human.Human(humanConfig);


/* =========================
   STATUS
========================= */

function setStatus(msg, cls) {

  const el = document.getElementById('status');

  el.textContent = msg;

  el.className =
    'status' +
    (cls ? ' ' + cls : '');

}


function setScore(msg) {

  document.getElementById('score').textContent =
    msg || '';

}


/* =========================
   INIT
========================= */

async function init() {

  document.getElementById('title').textContent =
    mode === 'punch'
      ? (teacher + ' - Punch ' + type)
      : 'Master Face Registration';


  if (mode === 'punch' && (!scriptUrl || !token)) {

    setStatus(
      'Camera session information missing.',
      'bad'
    );

    return;
  }


  try {

    setStatus(
      'AI models load ho rahe hain...'
    );


    await human.load();

    await human.warmup();

    humanReady = true;


    if (mode === 'punch') {

      await loadMasterEmbedding();

      if (!masterEmbedding) {
        return;
      }

    }


    setStatus(
      'Camera start karne ke liye button dabayein.'
    );


  } catch (e) {

    console.error(e);

    setStatus(
      'AI model load nahi hua: ' +
      (e.message || e),
      'bad'
    );

  }

}


/* =========================
   MASTER FACE LOAD
========================= */

function loadMasterEmbedding() {

  return new Promise((resolve) => {

    const callbackName =
      'cameraCallback_' + Date.now();


    window[callbackName] = function(res) {

      try {
        delete window[callbackName];
      } catch(e) {}


      if (
        !res ||
        !res.success ||
        !Array.isArray(res.embedding)
      ) {

        setStatus(
          (res && res.message) ||
          'Master Face AI data nahi mila.',
          'bad'
        );

        resolve(false);

        return;
      }


      masterEmbedding = res.embedding;


      setScore(
        'Master Face AI data ready.'
      );


      resolve(true);

    };


    const s =
      document.createElement('script');


    s.src =
      scriptUrl +
      '?action=cameraSession' +
      '&token=' +
      encodeURIComponent(token) +
      '&callback=' +
      callbackName +
      '&_=' +
      Date.now();


    s.onerror = function() {

      try {
        delete window[callbackName];
      } catch(e) {}


      setStatus(
        'Google Apps Script se Face AI data nahi mila.',
        'bad'
      );


      resolve(false);

    };


    document.body.appendChild(s);

  });

}


/* =========================
   START CAMERA
========================= */

async function startCamera() {

  if (!humanReady) {

    setStatus(
      'AI model abhi ready nahi hai.',
      'bad'
    );

    return;
  }


  stopCamera();


  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: 'user'
          },

          width: {
            ideal: 640
          },

          height: {
            ideal: 480
          }

        },

        audio: false

      });


    const video =
      document.getElementById('video');


    video.srcObject = stream;


    await video.play();


    document.getElementById(
      'capture'
    ).disabled = false;


    setStatus(
      'Face ko oval ke andar rakhein, phir Capture Photo dabayein.'
    );


    setScore('');


  } catch (e) {

    console.error(e);


    setStatus(
      'Chrome camera permission Allow karein. Error: ' +
      (e.message || e),
      'bad'
    );

  }

}


/* =========================
   STOP CAMERA
========================= */

function stopCamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(t => t.stop());

    stream = null;

  }

}


/* =========================
   CAPTURE
========================= */

async function capture() {

  if (busy || !stream) {
    return;
  }


  busy = true;


  document.getElementById(
    'capture'
  ).disabled = true;


  try {

    const video =
      document.getElementById('video');

    const canvas =
      document.getElementById('canvas');


    const w =
      video.videoWidth || 640;

    const h =
      video.videoHeight || 480;


    const max = 720;


    const scale =
      Math.min(
        1,
        max / Math.max(w, h)
      );


    canvas.width =
      Math.round(w * scale);

    canvas.height =
      Math.round(h * scale);


    const ctx =
      canvas.getContext(
        '2d',
        {
          willReadFrequently: true
        }
      );


    /*
     * Saved image mirror nahi hogi.
     * AI ko normal camera orientation milegi.
     */

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    setStatus(
      'Face AI verification chal raha hai...'
    );


    setScore('');


    const result =
      await human.detect(canvas);


    if (
      !result.face ||
      result.face.length !== 1
    ) {

      throw new Error(

        !result.face ||
        result.face.length === 0

          ? 'Face detect nahi hua. Roshni badhayein aur camera ke saamne seedhe dekhein.'

          : 'Ek se zyada face detect hua. Sirf ek person camera ke saamne ho.'

      );

    }


    const face =
      result.face[0];


    if (
      !face.embedding ||
      !Array.isArray(face.embedding) ||
      !face.embedding.length
    ) {

      throw new Error(
        'Face AI embedding generate nahi hua. Dobara photo lein.'
      );

    }


    /* =========================
       PUNCH VERIFICATION
    ========================= */

    if (mode === 'punch') {

      const real =
        Number(
          face.real == null
            ? 1
            : face.real
        );


      const live =
        Number(
          face.live == null
            ? 1
            : face.live
        );


      setScore(

        'Match check...  | Real: ' +
        (real * 100).toFixed(0) +
        '% | Live: ' +
        (live * 100).toFixed(0) +
        '%'

      );


      if (
        real < 0.50 ||
        live < 0.10
      ) {

        throw new Error(
          'Live face confirm nahi hua. Photo/video screen ke bajay apna face camera ke saamne rakhein.'
        );

      }


      const similarity =
        human.match.similarity(
          masterEmbedding,
          face.embedding
        );


      const similarityPct =
        Number(similarity) * 100;


      const verified =
        similarity >= 0.50;


      setScore(
        'Similarity: ' +
        similarityPct.toFixed(1) +
        '%'
      );


      /*
       * Original Chrome flow:
       * window.opener.postMessage
       *
       * WebIntoApp flow:
       * Apps Script server par result save hoga.
       */

      sendToOpener({

        source:
          'GBPS_ATTENDANCE_CAMERA',

        action:
          'punchResult',

        success:
          true,

        verified:
          verified,

        similarity:
          similarityPct,

        photoData:
          canvas.toDataURL(
            'image/jpeg',
            0.82
          ),

        token:
          token

      });


      setStatus(

        verified

          ? '✔️ Face Match ho gaya. Attendance window me Submit Punch karein.'

          : '❌ Face Match nahi hua. Dobara try karein.',

        verified
          ? 'ok'
          : 'bad'

      );


      if (verified) {

        setTimeout(
          () => finish(true),
          250
        );

      }


    }

    /* =========================
       MASTER FACE REGISTRATION
    ========================= */

    else {

      sendToOpener({

        source:
          'GBPS_ATTENDANCE_CAMERA',

        action:
          'registrationResult',

        success:
          true,

        embedding:
          face.embedding,

        photoData:
          canvas.toDataURL(
            'image/jpeg',
            0.82
          )

      });


      setScore(
        'Face AI data successfully generated.'
      );


      setStatus(
        '✔️ Master Face capture ho gaya. Is window ko band kar sakte hain.',
        'ok'
      );


      setTimeout(
        () => finish(true),
        900
      );

    }


    stopCamera();


  } catch (e) {

    console.error(e);


    setStatus(
      '❌ ' + (e.message || e),
      'bad'
    );


    document.getElementById(
      'capture'
    ).disabled = false;


  } finally {

    busy = false;

  }

}


/* =========================
   SEND RESULT
========================= */

function sendToOpener(data) {

  /*
   * Chrome / normal browser:
   * Original opener ko result bhejna.
   */

  if (
    window.opener &&
    !window.opener.closed
  ) {

    try {

      window.opener.postMessage(
        data,
        '*'
      );

    } catch(e) {

      console.error(e);

    }

  }


  /*
   * WebIntoApp / Android WebView:
   *
   * window.opener aksar available nahi hota.
   * Isliye verified Punch result
   * Apps Script par POST kiya jayega.
   */

  if (
    mode === 'punch' &&
    data &&
    data.action === 'punchResult' &&
    data.verified === true
  ) {

    submitPunchResultToServer(data);

  }

}


/* =========================
   WEBVIEW SERVER FALLBACK
========================= */

function submitPunchResultToServer(data) {

  if (!scriptUrl || !token) {
    return;
  }


  try {

    /*
     * Hidden iframe + POST use kiya gaya hai
     * taaki CORS/fetch problem na aaye.
     */

    const frame =
      document.createElement('iframe');


    frame.name =
      'cameraPost_' + Date.now();


    frame.style.display = 'none';


    document.body.appendChild(frame);


    const form =
      document.createElement('form');


    form.method =
      'POST';


    form.action =
      scriptUrl;


    form.target =
      frame.name;


    form.style.display =
      'none';


    function field(name, value) {

      const input =
        document.createElement('input');


      input.type =
        'hidden';


      input.name =
        name;


      input.value =
        value == null
          ? ''
          : String(value);


      form.appendChild(input);

    }


    field(
      'action',
      'cameraResult'
    );


    field(
      'token',
      token
    );


    field(
      'verified',
      data.verified === true
        ? 'true'
        : 'false'
    );


    field(
      'similarity',
      data.similarity || 0
    );


    field(
      'photoData',
      data.photoData || ''
    );


    document.body.appendChild(form);


    form.submit();


    setTimeout(() => {

      try {
        form.remove();
      } catch(e) {}


      try {
        frame.remove();
      } catch(e) {}

    }, 10000);


  } catch(e) {

    console.error(
      'Camera result POST error:',
      e
    );

  }

}


/* =========================
   FINISH CAMERA
========================= */

function finish(success) {

  stopCamera();


  /*
   * Chrome:
   * Original attendance page ka opener available hai.
   */

  if (
    window.opener &&
    !window.opener.closed
  ) {

    setTimeout(() => {

      try {
        window.close();
      } catch(e) {}

    }, 100);

    return;
  }


  /*
   * WebIntoApp:
   *
   * Punch successful hone ke baad
   * Apps Script attendance page par
   * cameraResult token ke saath return.
   */

  if (
    mode === 'punch' &&
    success === true &&
    returnUrl &&
    token
  ) {

    setTimeout(() => {

      try {

        const sep =
          returnUrl.indexOf('?') >= 0
            ? '&'
            : '?';


        window.location.replace(

          returnUrl +
          sep +
          'cameraResult=' +
          encodeURIComponent(token)

        );

      } catch(e) {

        console.error(
          'Return URL error:',
          e
        );


        setStatus(
          'Original attendance page open nahi ho saka.',
          'bad'
        );

      }

    }, 700);


    return;
  }


  /*
   * Registration / normal close
   */

  if (success) {

    setTimeout(() => {

      try {
        window.close();
      } catch(e) {}

    }, 100);

  }

}


/* =========================
   CLEANUP
========================= */

window.addEventListener(
  'beforeunload',
  stopCamera
);


/* =========================
   START APP
========================= */

init();

</script>

</body>
</html>
